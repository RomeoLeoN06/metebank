name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Native Android APK with Cordova
        run: |
          npm install -g cordova
          cordova create android_app com.metebank.kpss "KPSS Lisans"
          rm -rf android_app/www/*
          find . -maxdepth 1 -type f -exec cp {} android_app/www/ \;
          cp -r icons android_app/www/ 2>/dev/null || true
          cd android_app
          cordova platform add android@12.0.0
          cordova build android --debug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: KPSS_Lisans_Soru_Bankasi_APK
          path: android_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
